<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Results | Archha Grocery</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body data-page="search">
  <div class="topbar">Search products, aisles, and nearby partner shops.</div>
  <nav class="nav" aria-label="Main navigation">
    <a class="brand" href="index.html"><span class="brand-mark">A</span>Archha<span>Grocery</span></a>
    <div class="nav-links">
      <a href="index.html" data-nav="home">Home</a>
      <a href="shop.html" data-nav="shop">Shop</a>
      <a href="wishlist.html" data-nav="wishlist">Wishlist</a>
      <a href="orders.html" data-nav="orders">Orders</a>
      <a href="profile.html" data-nav="profile">Profile</a>
      <a href="request-product.html" data-nav="request">Request Product</a>
      <a href="login.html" data-nav="login">Login</a>
    </div>
    <form class="nav-search" data-nav-search>
      <input type="search" name="q" placeholder="Search groceries..." aria-label="Search products" />
      <button type="submit" aria-label="Search">Go</button>
    </form>
    <div class="nav-actions">
      <a class="icon-btn" href="shop.html" aria-label="Shop products">Shop</a>
      <a class="cart-btn" href="cart.html">Cart <span data-cart-count>0</span></a>
    </div>
  </nav>

  <main>
    <section class="page-hero compact">
      <div class="page-hero-inner">
        <div class="kicker">Search</div>
        <h1 id="searchResultsTitle">Search products.</h1>
        <p id="searchResultsSummary">Loading results...</p>
      </div>
    </section>

    <section class="section">
      <div class="products" id="searchResultsGrid"></div>
    </section>
  </main>

  <footer class="footer">Copyright 2026 Archha Grocery. Fresh daily essentials.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/api.js"></script>
  <script src="assets/site.js"></script>
</body>

</html>
